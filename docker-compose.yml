services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # These run automatically, in filename order, the FIRST time the
      # container starts with an empty data volume — this is what sets
      # up the schema and seed data with zero manual steps.
      - ./backend/db/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/migrations/002_add_users.sql:/docker-entrypoint-initdb.d/02_users_schema.sql:ro
      - ./backend/db/seed/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
      - ./backend/db/seed/seed_users.sql:/docker-entrypoint-initdb.d/04_seed_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: docker_dev_secret_change_in_production
    ports:
      - "4000:4000"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  db_data:
